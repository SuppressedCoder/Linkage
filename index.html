<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Linkage</title>
<meta name="description" content="Map FRC controller inputs to WPILib commands and generate configureBindings().">


<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <h1><svg viewBox="0 0 30 18" aria-hidden="true"><circle cx="9" cy="9" r="6.5" fill="none" stroke="var(--blue)" stroke-width="2.6"/><circle cx="21" cy="9" r="6.5" fill="none" stroke="var(--red)" stroke-width="2.6"/><path d="M15 3.6 A6.5 6.5 0 0 1 15 14.4" fill="none" stroke="var(--blue)" stroke-width="2.6"/></svg>Linkage</h1>
    <p>Controller bindings for WPILib command-based robots</p>
  </div>
  <nav class="tools" aria-label="Panels">
    <button data-act="open" data-panel="code" aria-pressed="false">Code</button>
    <button data-act="open" data-panel="cheat" aria-pressed="false">Cheat sheet</button>
    <button data-act="open" data-panel="share" aria-pressed="false">Save &amp; import</button>
    <button data-act="open" data-panel="setup" aria-pressed="false">Setup</button>
  </nav>
  <div class="hist">
    <button id="undoBtn" data-act="undo" title="Undo (Ctrl+Z)">Undo</button>
    <button id="redoBtn" data-act="redo" title="Redo (Ctrl+Shift+Z)">Redo</button>
  </div>
</header>
<main id="main" class="band"></main>
<div id="dialog"></div>
<footer class="foot band no-print">
  <p>Opens with an example robot (a 2024-style note game). Paste your own RobotContainer.java under Save &amp; import. Your work stays on this computer. Linkage is AI-generated; check the code before you deploy it.</p>
</footer>
<div id="toast" class="toast" role="status" hidden></div>
<script type="module" src="src/app.js"></script>
</body>
</html>
